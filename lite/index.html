<script>
  (function () {
    var sp = document.getElementById('splash');
    var done = false;
    function dismiss() {
      if (done) return; done = true;
      sp.style.opacity = '0';
      setTimeout(function () { sp.style.display = 'none'; }, 650);
    }
    window.addEventListener('pointerdown', dismiss);
    window.addEventListener('keydown', dismiss);
    setTimeout(dismiss, 6000); // 操作がなくても6秒で自動で閉じる
  })();

<script>
  window.__showErr = function (msg) {

    if (ld) { ld.style.opacity = '1'; ld.textContent = 'エラーが発生しました（画面下部に表示）'; }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/*
  HD-2D lite ― 地方データ駆動版（2026-11-18）
  地方（エリア）は下の REGIONS のデータで定義する。地方の追加はデータの追加だけで行う。
  仕様は docs/hd2d-region-data-design-2026-11-18.md を参照。
*/

const loadingEl = document.getElementById('loading');
const manager = new THREE.LoadingManager();
manager.onLoad = () => { loadingEl.style.opacity = '0'; setTimeout(() => loadingEl.remove(), 700); };
manager.onError = (u) => { loadingEl.textContent = '読み込みに失敗しました: ' + u; };
const texLoader = new THREE.TextureLoader(manager);
function loadTex(path, srgb = true) {
  const t = texLoader.load(path);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.anisotropy = 8;
  return t;
}
// 遠景用：縮小→拡大の往復で輪郭のギザギザを消し、柔らかくぼかしたテクスチャを作る
function blurredTex(path, scale = 0.28, passes = 2) {
  const tex = new THREE.Texture();
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  new THREE.ImageLoader().load(path, (img) => {
    const w = img.width, h = img.height;
    const small = document.createElement('canvas');
    small.width = Math.max(2, Math.round(w * scale)); small.height = Math.max(2, Math.round(h * scale));
    const full = document.createElement('canvas');
    full.width = w; full.height = h;
    const xs = small.getContext('2d'), xf = full.getContext('2d');
    xs.imageSmoothingEnabled = xf.imageSmoothingEnabled = true;
    xs.imageSmoothingQuality = xf.imageSmoothingQuality = 'high';
    let src = img;
    for (let i = 0; i < passes; i++) {
      xs.clearRect(0, 0, small.width, small.height);
      xs.drawImage(src, 0, 0, small.width, small.height);
      xf.clearRect(0, 0, w, h);
      xf.drawImage(small, 0, 0, w, h);
      src = full;
    }
    tex.image = full;
    tex.needsUpdate = true;
  });
  return tex;
}

// ---------- レンダラ / シーン / カメラ ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy(); // 地面の遠方を潰さないための異方性フィルタ
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3b2b52);
scene.fog = new THREE.Fog(0x463257, 20, 52);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 200);

// ---------- ライト ----------
const sun = new THREE.DirectionalLight(0xffb36b, 2.6);
sun.position.set(-14, 11, -5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -18; sun.shadow.camera.right = 18;
sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -10;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(sun.target);
const hemi = new THREE.HemisphereLight(0x8a6bb8, 0x2e4038, 1.0);
scene.add(hemi);
const fill = new THREE.DirectionalLight(0x7a86ff, 0.35);
fill.position.set(8, 6, 10);
scene.add(fill);

// ---------- 乱数（地方ごとのシードで再現可能にする） ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- 地面テクスチャ（Canvas生成のドット絵） ----------
function groundTexture(base, dots, patch) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 256, 256);
  const wrap9 = (fn) => { for (const ox of [-256, 0, 256]) for (const oy of [-256, 0, 256]) fn(ox, oy); };
  for (let i = 0; i < 26; i++) { // まだら（端で切れないよう9方向に描いて継ぎ目をなくす）
    x.fillStyle = patch; x.globalAlpha = 0.16 + Math.random() * 0.14;
    const r = 14 + Math.random() * 34, px = Math.random() * 256, py = Math.random() * 256, rot = Math.random() * 3;
    wrap9((ox, oy) => { x.beginPath(); x.ellipse(px + ox, py + oy, r, r * 0.6, rot, 0, 7); x.fill(); });
  }
  x.globalAlpha = 1;
  for (let i = 0; i < 5200; i++) {
    x.fillStyle = dots[(Math.random() * dots.length) | 0];
    const px = (Math.random() * 256) | 0, py = (Math.random() * 256) | 0;
    wrap9((ox, oy) => x.fillRect(px + ox, py + oy, 2, 2));
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  return t;
}
// 地面テクスチャ: 本編タイル画像があればそれを使い、なければ色指定から生成する
function makeGroundTexture(key) {
  const td = GROUND_TEX[key];
  let t;
  if (td.img) {
    t = loadTex(td.img);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;

let activeColliders = [];
let activeNPCs = [];
function resolveCollisions(pos, radius) {
  for (const c of activeColliders) {
    const dx = pos.x - c.x, dz = pos.z - c.z;
    const rr = radius + c.r, d2 = dx * dx + dz * dz;
    if (d2 < rr * rr && d2 > 1e-8) {
      const d = Math.sqrt(d2);
      pos.x = c.x + dx / d * rr;
      pos.z = c.z + dz / d * rr;
    }
  }
  for (const npc of activeNPCs) {
    const np = npc.mesh.position;
    const dx = pos.x - np.x, dz = pos.z - np.z;
    const rr = radius + 0.42, d2 = dx * dx + dz * dz;
    if (d2 < rr * rr && d2 > 1e-8) {
      const d = Math.sqrt(d2);
      pos.x = np.x + dx / d * rr;
      pos.z = np.z + dz / d * rr;
    }
  }
}

function setFrameC(ch, rowFromTop, col) {
  const tex = ch.userData.tex, rows = ch.userData.rows;
  // 公式歩行シート由来の不具合対策：nono の横向き行は1コマ目だけ顔が逆を向いて描かれているため、
  // そのコマだけ左右反転して表示する（E行では左向き→右向きに、W行では右向き→左向きになる）
  const flip = ch.userData.flipSide0 && col === 0 && (rowFromTop === 2 || rowFromTop === 6);
  // 横向き（E/W行）は縦・斜めに比べて太く見えるため、背丈を変えず横幅だけ少し細くする（nono のみ）
  ch.scale.x = (ch.userData.sideSlim && (rowFromTop === 2 || rowFromTop === 6)) ? ch.userData.sideSlim : 1;
  tex.repeat.x = flip ? -1 / 3 : 1 / 3;
  tex.offset.set(flip ? (col + 1) / 3 : col / 3, (rows - 1 - rowFromTop) / rows);
}

function rowFromVel(vx, vy) {
  const ax = Math.abs(vx), ay = Math.abs(vy);
  if (ax > ay * 1.6) return vx > 0 ? 2 : 6;

}

// 軌跡（仲間の追従用）
const trail = [];
let trailAcc = 0;
function trailPoint(dist) {
  let acc = 0;
  for (let i = 0; i < trail.length - 1; i++) {
    const a = trail[i], b = trail[i + 1];
    const seg = Math.hypot(a.x - b.x, a.z - b.z);
    if (acc + seg >= dist) {
      const tt = seg > 0 ? (dist - acc) / seg : 0;
      return { x: a.x + (b.x - a.x) * tt, z: a.z + (b.z - a.z) * tt };
    }
    acc += seg;
  }
  return trail[trail.length - 1];
}
function seedTrail(x, z, signX, signZ) {
  trail.length = 0;
  for (let i = 0; i <= 16; i++) trail.push({ x: x + signX * i * 0.2, z: z + signZ * i * 0.2 });
}
function updateCompanion(ch, target, station, dt, wadeZ) {
  const ud = ch.userData;
  const dx = target.x - ch.position.x, dz = target.z - ch.position.z;
  // 目標点の速度を見積もってフィードフォワードする。
  // 位置を追うだけだと追従の遅れがそのまま間隔の偏りになるため、速度も合わせて寄せる
  let tvx = 0, tvz = 0;
  if (ud.prevTarget && dt > 0) {
    tvx = (target.x - ud.prevTarget.x) / dt;
    tvz = (target.z - ud.prevTarget.z) / dt;
    const tl = Math.hypot(tvx, tvz);
    if (tl > 3.5) { tvx *= 3.5 / tl; tvz *= 3.5 / tl; }
  }
  ud.prevTarget = { x: target.x, z: target.z };
  let desX = tvx + dx * 5, desZ = tvz + dz * 5; // ずれはゲイン5/sで戻す
  const dl = Math.hypot(desX, desZ);
  if (dl > 4.2) { desX *= 4.2 / dl; desZ *= 4.2 / dl; }
  const acc = 1 - Math.pow(0.0025, dt);
  ud.vel.x += (desX - ud.vel.x) * acc;
  ud.vel.y += (desZ - ud.vel.y) * acc;
  const spd = Math.hypot(ud.vel.x, ud.vel.y);
  const px = ch.position.x, pz = ch.position.z;
  ch.position.x = THREE.MathUtils.clamp(px + ud.vel.x * dt, walkBounds.minX, walkBounds.maxX);
  ch.position.z = THREE.MathUtils.clamp(pz + ud.vel.y * dt, walkBounds.minZ, walkBounds.maxZ);
  const moved = Math.hypot(ch.position.x - px, ch.position.z - pz);
  if (spd > 0.35) {
    // 向きは追いかけ速度でなく軌跡の進行方向で決める。
    // 速度基準だと、目標点を追い越した瞬間に反転して後ろを向いてしまうため
    const ahead = trailPoint(Math.max(0, station - 0.25));
    const behind = trailPoint(station + 0.25);
    const pvx = ahead.x - behind.x, pvz = ahead.z - behind.z;
    if (pvx * pvx + pvz * pvz > 0.0001) ud.dirRow = rowFromVel(pvx, pvz);
  }
  ud.walkPhase += moved / STEP_LENS[ud.dirRow];
  if (spd > 0.25) {
    setFrameC(ch, ud.dirRow, WALK_SEQ[Math.floor(ud.walkPhase) % 4]);
    ch.position.y = Math.abs(Math.sin(ud.walkPhase * Math.PI)) * BOB_AMPS[ud.dirRow];
  } else {
    setFrameC(ch, ud.dirRow, 1);
    ch.position.y = 0;
  }
  if (wadeZ !== null && ch.position.z < wadeZ && spd > 0.4) {
    ud.rippleTimer += dt;
    if (ud.rippleTimer > 0.26) { ud.rippleTimer = 0; spawnRipple(ch.position.x, ch.position.z + 0.05); }
  }
}

function buildValleyCustom(group) {
  // 渓谷の川（流れの縞と両岸の泡で、静止画でも流れと分かる専用シェーダー）
  const riverGeo = new THREE.PlaneGeometry(40, 2.2, 96, 6);
  {
    // 両岸が直線にならないよう、川幅を場所ごとに波打たせる（シェーダー側と同式）
    const pos = riverGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const lx = pos.getX(i);
      const wob = 0.15 * Math.sin(lx * 0.55) + 0.10 * Math.sin(lx * 1.37 + 1.7) + 0.05 * Math.sin(lx * 3.1 + 0.5);
      pos.setY(i, pos.getY(i) * (1 + wob / 1.1));
    }
    riverGeo.computeVertexNormals();
  }
  const river = new THREE.Mesh(
    riverGeo,
    new THREE.ShaderMaterial({
      uniforms: { uTime: waterUniforms.uTime, uWtr: waterUniforms.uWtr },
      transparent: true,
      depthWrite: false,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime; uniform float uWtr;
        varying vec2 vUv;
        void main() {
          float t = uTime;
          vec3 deep = vec3(0.05, 0.17, 0.27);
          vec3 shal = vec3(0.16, 0.34, 0.48);
          // 流れは東向き（画面右）へ一方向。縞は川幅方向（y）で変わる横縞にし、x へ長く伸びて流れる
          float fx = vUv.x - t * 0.055;
          float w1 = sin(vUv.y * 34.0 + sin(fx * 26.0) * 1.6 + sin(fx * 61.0) * 0.7);
          float w2 = sin(vUv.y * 13.0 - sin(fx * 17.0) * 1.2);
          vec3 col = mix(deep, shal, 0.5 + 0.26 * w1 + 0.24 * w2);
          float glint = smoothstep(0.975, 1.0, sin(vUv.y * 120.0 + sin((vUv.x - t * 0.11) * 46.0) * 2.2) * 0.5 + 0.5);
          col += vec3(0.75, 0.85, 0.9) * glint * 0.5;
          float foamN = 0.5 + 0.5 * sin(fx * 170.0) * sin((vUv.x - t * 0.04) * 57.0);
          float lx = (vUv.x - 0.5) * 40.0;
          float wob = 0.15 * sin(lx * 0.55) + 0.10 * sin(lx * 1.37 + 1.7) + 0.05 * sin(lx * 3.1 + 0.5);
          float dEdge = (0.5 - abs(vUv.y - 0.5)) * 2.2 * (1.0 + wob / 1.1);
          float bank = smoothstep(0.0, 0.22, dEdge);
          float foam = (1.0 - bank) * smoothstep(0.45, 0.9, foamN);
          col = mix(col, vec3(0.82, 0.88, 0.88), foam * 0.55);
          col *= uWtr; // 時刻による水面の明るさ
          float alpha = 0.97 * smoothstep(0.0, 0.13, dEdge);
          gl_FragColor = vec4(col, alpha);
        }`,
    })
  );
  river.rotation.x = -Math.PI / 2;
  river.position.set(425, 0.02, -2.2);
  river.renderOrder = 2;
  group.add(river);
}

function buildRegion(id, def) {
  const group = new THREE.Group();
  group.visible = false;
  scene.add(group);
  const colliders = [];
  const rng = mulberry32(1000 + id.length * 77 + id.charCodeAt(0));
  let backdropMat = null;
  if (def.backdrop) { // 地方ごとの遠景ボード（北の奥）
    const bTex = loadTex(def.backdrop);
    bTex.magFilter = THREE.LinearFilter;
    backdropMat = new THREE.MeshBasicMaterial({ map: bTex, fog: false });
    const board = new THREE.Mesh(new THREE.PlaneGeometry(96, 40), backdropMat);
    board.position.set(def.centerX + 6, 8.5, -30);
    group.add(board);
  }
  for (const g of def.grounds || []) {
    let mat;
    const gm = ORGANIC_GROUND_KEYS.has(g.tex) ? 3 : 2; // 高精細化: 模様を細かく（有機質はより細かく）
    if (g.tex) {
      const tex = makeGroundTexture(g.tex);
      tex.repeat.set(g.repeat[0] * gm, g.repeat[1] * gm);
      mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 1 });
    } else {
      mat = new THREE.MeshStandardMaterial({ color: g.color, roughness: 1 });
    }
    if (g.strip || g.soft) { // 縁を透かして下の地面へ馴染ませる
      if (!_stripAlpha) { _stripAlpha = stripAlphaTexture(); _softAlpha = softAlphaTexture(); }
      const at = (g.strip ? _stripAlpha : _softAlpha).clone();
      at.wrapS = at.wrapT = THREE.RepeatWrapping;
      at.repeat.set(g.repeat ? g.repeat[0] * gm : 1, g.repeat ? g.repeat[1] * gm : 1);
      at.needsUpdate = true;
      mat.transparent = true;
      mat.alphaMap = at;
    }
    const m = new THREE.Mesh(new THREE.PlaneGeometry(g.w, g.d), mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(g.x, g.y, g.z);
    m.receiveShadow = true;
    group.add(m);
  }
  if (def.snowDepth) { // 雪の積もった地面（膝丈）。キャラや小物の足元が雪に埋まる
    const g0 = (def.grounds || [])[0];
    if (g0) {
      const tex = makeGroundTexture('snow');
      tex.repeat.set(39, 18);
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(g0.w, g0.d),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 1 })
      );
      m.rotation.x = -Math.PI / 2;
      m.position.set(g0.x, def.snowDepth, g0.z);
      m.receiveShadow = true;
      group.add(m);
    }
  }
  const placeProp = (p, r) => {
    const snowy = !!def.snow; // 雪原では各小物に雪を積もらせる
    if (p.t === 'pine') placePine(group, colliders, p.x, p.z, p.s || 1, r, snowy);
    else if (p.t === 'tree') placeTree(group, colliders, p.x, p.z, p.s || 1, r, snowy);
    else if (p.t === 'gtree') placeBigTree(group, colliders, p.x, p.z, 'tree_great.png', 644 / 592, 4.3, 1.0);
    else if (p.t === 'wtree') placeBigTree(group, colliders, p.x, p.z, 'tree_wide.png', 532 / 468, 3.1, 0.9);
    else if (p.t === 'rock') placeRock(group, colliders, p.x, p.z, p.s || 1, r, snowy);
    else if (p.t === 'driftwood') placeDriftSprite(group, colliders, p.x, p.z, p.rot || 0);
    else if (p.t === 'stump') placeStumpSprite(group, colliders, p.x, p.z);
    else if (p.t === 'signpost') placeSignpost(group, colliders, p.x, p.z, p.rot || 0);
    else if (p.t === 'torii') placeTorii(group, colliders, p.x, p.z, p.s || 1, p.rot || 0, snowy);
    else if (p.t === 'shrine') placeShrine(group, colliders, p.x, p.z, p.s || 1, p.rot || 0, snowy);
    else if (p.t === 'house') placeHouse(group, colliders, p.x, p.z, p.s || 1, p.roof || (p.thatch ? 'kaya' : 'kawara'));
    else if (p.t === 'labgate') placeLabGate(group, colliders, p.x, p.z);
    else if (p.t === 'tuft') placeTuft(group, p.x, p.z, r, p.s || 1, def.lush ? grassLushTex : grassTuftTex);
    else if (p.t === 'drift') placeDrift(group, p.x, p.z, p.s || 1, def.snowDepth || 0);
    else if (p.t === 'flower') placeFlower(group, p.x, p.z, r, p.s || 1);
    else if (p.t === 'pillar') placePillar(group, colliders, p.x, p.z, p.s || 1);
    else if (p.t === 'bamboo') placeBamboo(group, colliders, p.x, p.z, p.s || 1);
    else if (p.t === 'dtree') placeDeadTree(group, colliders, p.x, p.z, p.s || 1);
    else if (p.t === 'willow') placeWillow(group, colliders, p.x, p.z, p.s || 1);
    else if (p.t === 'log') placeLog(group, colliders, p.x, p.z, p.s || 1);
    else if (p.t === 'woodpile') placeWoodPile(group, colliders, p.x, p.z, p.s || 1);
    else if (p.t === 'lavarock') placeLavaRock(group, colliders, p.x, p.z, p.s || 1);
  };
  for (const p of def.props || []) placeProp(p, rng);
  for (const s of def.scatter || []) {
    const srng = mulberry32(s.seed);
    for (let i = 0; i < s.n; i++) {
      const x = s.x[0] + srng() * (s.x[1] - s.x[0]);
      const side = s.side ? s.side : (i % 2 === 0 ? -1 : 1); // side指定があればその側だけに散布
      const z = s.zCenter + side * (s.offMin + srng() * (s.offMax - s.offMin));
      // 手前側（カメラ側）の木は背を低くして、道と一行を見えやすくする
      const sc = (s.s[0] + srng() * (s.s[1] - s.s[0])) * (side > 0 && s.frontS ? s.frontS : 1);
      placeProp({ t: s.t, x, z, s: sc }, srng);
    }
  }
  const npcs = [];
  for (const n of def.npcs || []) {
    const mesh = makeChar(n.sheet, n.h, 3, group);
    mesh.position.set(n.x, 0, n.z);
    setFrameC(mesh, 0, 1);
    npcs.push({ mesh, name: n.name, lines: n.lines, t: Math.random() * 4 });
  }
  const enemies = [];
  for (const e of def.enemies || []) {
    const kind = ENEMY_KINDS[e.kind];
    const tscale = (kind.tier === 'boss' || kind.tier === 'mid') ? 1.3 : 0.8;
    const useDiag = tscale > 1 && DIAG_ASPECT[e.kind];
    const mesh = billboard(group, loadTex(useDiag ? `assets/enemy_${e.kind}_diag.png` : kind.img), kind.h * tscale * (useDiag ? DIAG_ASPECT[e.kind] : kind.aspect), kind.h * tscale, e.x, e.z, {});
    const shadow = blobShadow(group, kind.h * tscale * 0.95, e.x, e.z, 0.3);
    enemies.push({ mesh, shadow, kindKey: e.kind, home: { x: e.x, z: e.z }, tx: e.x, tz: e.z, wait: Math.random() * 2, alive: true, respawnAt: 0, phase: Math.random() * 6 });
  }
  if (def.fireflies) addFireflies(group, def.fireflies.n, def.fireflies.box, def.fireflies.seed);
  if (def.custom && CUSTOM_BUILDERS[def.custom]) CUSTOM_BUILDERS[def.custom](group);
  REGION_RT[id] = { group, colliders, npcs, backdropMat, enemies };
}

const LAB_TILE = 2.5, LAB_OX = 2000;

const labTileOf = (wx, wz, d) => ({ x: Math.floor((wx - LAB_OX) / LAB_TILE), y: Math.floor((wz + (d.h * LAB_TILE) / 2) / LAB_TILE) });

function bfsDist(tiles, w, h, s) {
  const dist = new Int32Array(w * h).fill(-1);
  const q = [s.y * w + s.x]; dist[s.y * w + s.x] = 0;
  for (let head = 0; head < q.length; head++) {
    const cur = q[head], cx = cur % w, cy = (cur / w) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const ni = ny * w + nx;
      if (tiles[ni] === 0 && dist[ni] < 0) { dist[ni] = dist[cur] + 1; q.push(ni); }
    }
  }
  return dist;
}

// 仕様: seed決定的・全床到達可能・部屋＋通路（ループあり）・start/goal は十分離す
function generateLabyrinth(seed, opts = {}) {
  const w = opts.w || 25, h = opts.h || 19;
  const rng = mulberry32(seed >>> 0);
  const tiles = new Uint8Array(w * h).fill(1);
  const rooms = [];
  let tries = 0;
  const targetRooms = opts.rooms || 9;
  while (rooms.length < targetRooms && tries < 400) {
    tries++;
    const rw = 3 + Math.floor(rng() * 3), rh = 3 + Math.floor(rng() * 2);
    const rx = 1 + Math.floor(rng() * (w - rw - 2)), ry = 1 + Math.floor(rng() * (h - rh - 2));
    if (rooms.some(r => rx < r.x + r.w + 1 && rx + rw + 1 > r.x && ry < r.y + r.h + 1 && ry + rh + 1 > r.y)) continue;
    rooms.push({ x: rx, y: ry, w: rw, h: rh, cx: rx + (rw >> 1), cy: ry + (rh >> 1) });
  }
  const carve = (x, y) => { if (x > 0 && y > 0 && x < w - 1 && y < h - 1) tiles[y * w + x] = 0; };
  for (const r of rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) carve(x, y);
  const centers = rooms.map(r => ({ x: r.cx, y: r.cy }));
  const connected = [0], rest = centers.map((_, i) => i).slice(1), edges = [];
  while (rest.length) {
    let bi = -1, bj = -1, bd = 1e9;
    for (const i of connected) for (const j of rest) {
      const dd = Math.abs(centers[i].x - centers[j].x) + Math.abs(centers[i].y - centers[j].y);
      if (dd < bd) { bd = dd; bi = i; bj = j; }
    }
    edges.push([bi, bj]); connected.push(bj); rest.splice(rest.indexOf(bj), 1);
  }
  for (let i = 0; i + 1 < centers.length; i++) if (rng() < 0.3) edges.push([i, i + 1]); // ループ追加
  const corridor = (a, b) => {
    let x = a.x, y = a.y;
    const digH = (x2) => { while (x !== x2) { carve(x, y); x += Math.sign(x2 - x); } carve(x, y); };
    const digV = (y2) => { while (y !== y2) { carve(x, y); y += Math.sign(y2 - y); } carve(x, y); };
    if (rng() < 0.5) { digH(b.x); digV(b.y); } else { digV(b.y); digH(b.x); }
  };
  for (const [i, j] of edges) corridor(centers[i], centers[j]);
  // start/goal は部屋同士で最も遠いペアにする
  let start = centers[0], goal = centers[0], gd = -1;
  for (const c of centers) {
    const dist = bfsDist(tiles, w, h, c);
    for (const o of centers) {
      const dd = dist[o.y * w + o.x];
      if (dd > gd) { gd = dd; start = { x: c.x, y: c.y }; goal = { x: o.x, y: o.y }; }
    }
  }
  return { w, h, tiles, start, goal, rooms, pathLen: gd };
}

function buildLabyrinth(data) {
  const { w, h, tiles } = data;
  const group = new THREE.Group();
  const colliders = [];
  const oz = -(h * LAB_TILE) / 2;
  const fTex = loadTex('assets/gtex_stonefloor_dark.png');
  fTex.wrapS = fTex.wrapT = THREE.RepeatWrapping; fTex.repeat.set(w, h); fTex.anisotropy = MAX_ANISO;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w * LAB_TILE, h * LAB_TILE), new THREE.MeshStandardMaterial({ map: fTex, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(LAB_OX + (w * LAB_TILE) / 2, 0, 0);
  floor.receiveShadow = true;
  group.add(floor);
  const wallTiles = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (tiles[y * w + x] !== 1) continue;
    const adj = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      return nx >= 0 && ny >= 0 && nx < w && ny < h && tiles[ny * w + nx] === 0;
    });
    if (adj) wallTiles.push([x, y]);
  }
  const wTex = loadTex('assets/gtex_brick.png');
  wTex.wrapS = wTex.wrapT = THREE.RepeatWrapping;
  const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(LAB_TILE, 2.6, LAB_TILE), new THREE.MeshStandardMaterial({ map: wTex, color: 0xa8b0be, roughness: 1 }), wallTiles.length);
  const dummy = new THREE.Object3D();
  wallTiles.forEach(([x, y], i) => {
    const wx = LAB_OX + (x + 0.5) * LAB_TILE, wz = oz + (y + 0.5) * LAB_TILE;
    dummy.position.set(wx, 1.3, wz); dummy.updateMatrix();
    walls.setMatrixAt(i, dummy.matrix);
    colliders.push({ x: wx, z: wz, r: 1.32 });
  });
  walls.castShadow = true; walls.receiveShadow = true;
  group.add(walls);
  // 入口の階段と戻り口の目印
  const sw = labWorldOf(data.start.x, data.start.y, data);
  const stairMat = new THREE.MeshStandardMaterial({ color: 0x3c414c, roughness: 1 });
  for (let i = 0; i < 3; i++) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(1.5 - i * 0.3, 0.16, 0.42), stairMat);
    st.position.set(sw.x, 0.08 + i * 0.02, sw.z - 0.7 + i * 0.4);
    group.add(st);
  }
  const exitGlow = new THREE.Mesh(new THREE.CircleGeometry(0.85, 24), new THREE.MeshBasicMaterial({ color: 0xffb36b, transparent: true, opacity: 0.3 }));
  exitGlow.rotation.x = -Math.PI / 2; exitGlow.position.set(sw.x, 0.03, sw.z);
  group.add(exitGlow);
  // ゴールの宝珠
  const gw = labWorldOf(data.goal.x, data.goal.y, data);
  labGoalMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.42), new THREE.MeshStandardMaterial({ color: 0x1d4d43, emissive: 0x2fe8c0, emissiveIntensity: 1.6, roughness: 0.3 }));
  labGoalMesh.position.set(gw.x, 1.25, gw.z);
  group.add(labGoalMesh);
  labGoalLight = new THREE.PointLight(0x2fe8c0, 7, 8);
  labGoalLight.position.set(gw.x, 1.5, gw.z);
  group.add(labGoalLight);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.7, 0.95, 28), new THREE.MeshBasicMaterial({ color: 0x2fe8c0, transparent: true, opacity: 0.4, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(gw.x, 0.03, gw.z);
  group.add(ring);
  return { group, colliders };
}

function disposeLabGroup(g) {
  g.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) for (const m of Array.isArray(o.material) ? o.material : [o.material]) m.dispose();
  });
}
function enterLabyrinth(seed) {
  if (transitioning) return;
  transitioning = true;
  const fade = document.getElementById('fade');
  fade.style.opacity = '1';
  setTimeout(() => {
    const data = generateLabyrinth(seed !== undefined ? seed : (Math.random() * 2147483647) | 0);
    const rt = REGION_RT.labyrinth;
    for (const c of [...rt.group.children]) { rt.group.remove(c); disposeLabGroup(c); }
    const built = buildLabyrinth(data);
    rt.group.add(built.group);
    rt.colliders = built.colliders;
    lab = { data, visited: new Uint8Array(data.w * data.h), exitArmed: false, cleared: false, lastTx: -1, lastTy: -1 };
    window.__lab = lab;
    const sw = labWorldOf(data.start.x, data.start.y, data);
    teleportTo(sw.x, sw.z, 4, [0, 1], REGIONS.labyrinth.centerX);
    setRegion('labyrinth');
    labMarkVisited();

    setTimeout(() => { transitioning = false; }, 600);

}
function exitLabyrinth() {

function labMarkVisited() {
  if (!lab) return;
  const d = lab.data, { w, h, tiles } = d;
  const pt = labTileOf(player.position.x, player.position.z, d);
  const mark = (x, y) => { if (x >= 0 && y >= 0 && x < w && y < h && tiles[y * w + x] === 0) lab.visited[y * w + x] = 1; };
  for (const r of d.rooms) if (pt.x >= r.x && pt.x < r.x + r.w && pt.y >= r.y && pt.y < r.y + r.h)
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) mark(x, y);
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { if (Math.abs(dx) === 2 && Math.abs(dy) === 2) continue; mark(pt.x + dx, pt.y + dy); }
  drawMinimap();
}
function drawMinimap() {
  const cv = document.getElementById('minimap');
  if (!cv || !lab) return;
  const ctx = cv.getContext('2d');
  const d = lab.data, { w, h } = d, cell = 6;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#c9b489';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (lab.visited[y * w + x]) ctx.fillRect(x * cell, y * cell, cell, cell);
  if (lab.visited[d.goal.y * w + d.goal.x]) {
    ctx.fillStyle = '#2fe8c0';
    const gx = d.goal.x * cell + 3, gy = d.goal.y * cell + 3;
    ctx.beginPath(); ctx.moveTo(gx, gy - 2.6); ctx.lineTo(gx + 2.6, gy); ctx.lineTo(gx, gy + 2.6); ctx.lineTo(gx - 2.6, gy); ctx.fill();
  }
  if (lab.visited[d.start.y * w + d.start.x]) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.strokeRect(d.start.x * cell + 1, d.start.y * cell + 1, cell - 2, cell - 2); }
  const pt = labTileOf(player.position.x, player.position.z, d);
  ctx.fillStyle = '#ffd75e'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(pt.x * cell + 3, pt.y * cell + 3, 2.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}
function labTick(t) {
  if (labGoalMesh) { labGoalMesh.rotation.y = t * 1.4; labGoalMesh.position.y = 1.25 + Math.sin(t * 2) * 0.12; if (labGoalLight) labGoalLight.intensity = 6 + Math.sin(t * 2) * 1.5; }
  if (area !== 'labyrinth' || !lab || transitioning || dialog.open) return;
  const d = lab.data;
  const pt = labTileOf(player.position.x, player.position.z, d);
  if (pt.x !== lab.lastTx || pt.y !== lab.lastTy) { lab.lastTx = pt.x; lab.lastTy = pt.y; labMarkVisited(); }
  const sw = labWorldOf(d.start.x, d.start.y, d);
  const dStart = Math.hypot(player.position.x - sw.x, player.position.z - sw.z);
  if (!lab.exitArmed && dStart > 3) lab.exitArmed = true;
  if (lab.exitArmed && dStart < 0.9) { exitLabyrinth(); return; }
  if (!lab.cleared && pt.x === d.goal.x && pt.y === d.goal.y) {
    lab.cleared = true;
    openDialog({ name: '大迷宮', lines: ['最深部の宝珠に触れた！', '大迷宮を踏破した。入口へ戻ります…'], onClose: () => exitLabyrinth() });
  }
}

{
  const stick = document.getElementById('stick');
  const knob = document.getElementById('knob');
  let pid = null, cx = 0, cy = 0;
  const setKnob = (dx, dy) => { knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; };
  // 中心は押した瞬間に固定する（途中で画面が拡大・スクロールして矩形がずれても読みが狂わないように）
  stick.addEventListener('pointerdown', (e) => {

  });
  stick.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const len = Math.hypot(dx, dy), max = 36;
    if (len > max) { dx *= max / len; dy *= max / len; }
    setKnob(dx, dy);
    stickVec.x = dx / max; stickVec.y = dy / max;
  });
  const end = (e) => { if (e.pointerId === pid) { pid = null; stickVec.x = stickVec.y = 0; setKnob(0, 0); } };
  stick.addEventListener('pointerup', end);

function inputVector() {
  let x = 0, z = 0;
  if (keys.KeyA || keys.ArrowLeft) x -= 1;
  if (keys.KeyD || keys.ArrowRight) x += 1;
  if (keys.KeyW || keys.ArrowUp) z -= 1;
  if (keys.KeyS || keys.ArrowDown) z += 1;
  x += stickVec.x; z += stickVec.y;

// ================= BGM（WebAudioの簡易シーケンサー。フィールドとバトルで曲を切り替える） =================
const BGM = (() => {
  let ctx = null, master = null, timer = null, step = 0, nextT = 0, cur = 'field', muted = false;
  const bars = (arr) => arr.flat();
  const SONGS = {
    field: { bpm: 92,
      mel: bars([[76,0,79,0,81,0,79,0],[74,0,71,0,74,0,0,0],[76,0,81,0,79,0,76,0],[77,0,81,0,79,0,0,0],[76,0,79,0,84,0,79,0],[81,0,79,0,77,0,74,0],[77,0,81,0,79,0,76,0],[74,0,0,0,72,0,0,0]]),
      bassRoot: [48,43,45,41,48,43,41,48], bassPat: [1,0,0,0,2,0,0,0] },
    battle: { bpm: 138,
      mel: bars([[81,0,84,0,83,0,81,0],[81,0,88,0,86,0,84,0],[84,0,81,0,77,0,81,0],[83,0,86,0,83,0,79,0],[81,0,84,0,83,0,81,0],[88,0,86,0,84,0,83,0],[86,0,89,0,88,0,86,0],[83,0,80,0,83,0,0,0]]),
      bassRoot: [45,45,41,43,45,45,50,52], bassPat: [1,1,3,1,1,1,3,1] },
  };
  function freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function tone(m, t, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq(m);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function schedule() {
    const S = SONGS[cur], stepDur = 60 / S.bpm / 2;
    while (nextT < ctx.currentTime + 0.16) {
      const bar = Math.floor(step / 8), s = step % 8;
      const m = S.mel[step];
      if (m) tone(m, nextT, stepDur * 1.7, 'square', 0.042);
      const bp = S.bassPat[s];
      if (bp) tone(S.bassRoot[bar] + (bp === 2 ? 7 : bp === 3 ? 12 : 0), nextT, stepDur * 1.4, 'triangle', 0.075);
      step = (step + 1) % 64; nextT += stepDur;
    }
  }
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }

      ctx = new (window.AudioContext || window.webkitAudioContext)();

    } catch (e) { /* 音が出ない環境では無音で続行 */ }
  }
  window.addEventListener('pointerdown', init);
  return {
    fanfare() {
      if (!ctx) return;
      const t0 = ctx.currentTime + 0.03;
      [72, 76, 79, 84, 79, 84, 88].forEach((n, i) => tone(n, t0 + i * 0.11, 0.34, 'square', 0.05));
    },
    set(name) { if (SONGS[name]) cur = name; },
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.9; return muted; },
  };
})();

      ]);

async function foeTurn(f) {
  if (f.dead) return;
  if (f.rival && !f.moveUsed && f.hp <= f.maxhp * 0.55) {
    f.moveUsed = true;
    const mv = RIVALS[f.name].move;

      showFx(foeEl(f), 'heal');
      await bSleep(340);
      f.hp = Math.min(f.maxhp, f.hp + mv.val);
      dmgNumber(foeEl(f), mv.val, 'heal');
      refreshBattleUI();
      await bSleep(500);
      return;
    }
    const ids0 = aliveMembers(); if (!ids0.length) return;
    const t0 = ids0[Math.floor(Math.random() * ids0.length)];
    bMsg(f.name + ' の とくぎ！ ' + mv.name + '！');
    const hits = mv.type === 'hit2' ? 2 : 1;
    for (let i = 0; i < hits; i++) {
      if (PARTY[t0].hp <= 0) break;
      await hitMember({ foe: f }, t0, physDamage(f, PARTY[t0], mv.mult), { fx: i === 0 ? mv.fx : null });
    }
    return;
  }
  const ids = aliveMembers(); if (!ids.length) return;
  const t = ids[Math.floor(Math.random() * ids.length)];
  bMsg(f.name + ' の こうげき！');
  await hitMember({ foe: f }, t, physDamage(f, PARTY[t]));
}
async function battleLoop() {
  while (!battle.over) {
    for (const id of Object.keys(PARTY)) PARTY[id].defending = false;
    const order = [
      ...Object.keys(PARTY).filter((id) => PARTY[id].hp > 0).map((id) => ({ spd: PARTY[id].spd, run: () => (id === 'nono' ? nonoTurn() : npcTurn(id)) })),
      ...aliveFoes().map((f) => ({ spd: f.spd, run: () => foeTurn(f) })),
    ].sort((a, b) => b.spd - a.spd + Math.random() * 2);
    for (const a of order) {
      if (battle.over) break;
      await a.run();
      if (checkEnd()) break;
    }
  }
}

async function endBattle() {
  document.body.classList.remove('inbattle');
  const el = bEl('battle');
  if (battle.rival) {
    const name = battle.rival;
    if (battle.over === 'win') {
      const wasBeaten = SAVE.beaten.includes(name);
      const oldStage = swordStage();
      if (!wasBeaten) { SAVE.beaten.push(name); persistSave(); }
      const newStage = swordStage();
      bMsg(name + ' に 勝った！');
      for (const m of Object.values(PARTY)) { m.hp = Math.min(m.maxhp, m.hp + Math.ceil(m.maxhp * 0.3)); m.down = m.hp <= 0; }
      await bSleep(1100);
      el.style.opacity = '0'; await bSleep(480); el.style.display = 'none';
      BGM.set('field'); inBattle = false; battle.over = false; battle.rival = null;
      applySwordAtk();
      if (!wasBeaten && newStage > oldStage) await runEvolve(oldStage, newStage);
      return;
    }
    if (battle.over === 'lose') {
      bMsg(name + ' に 負けてしまった…（その場で回復した）');
      for (const m of Object.values(PARTY)) { m.hp = m.maxhp; m.mp = m.maxmp; m.down = false; }
      await bSleep(1300);
    }
    el.style.opacity = '0'; await bSleep(480); el.style.display = 'none';
    BGM.set('field'); inBattle = false; battle.over = false; battle.rival = null;
    return;
  }
  if (battle.over === 'win') {
    bMsg('戦いに 勝った！ みんな 少し 回復した。');
    for (const m of Object.values(PARTY)) { m.hp = Math.min(m.maxhp, m.hp + Math.ceil(m.maxhp * 0.3)); m.down = m.hp <= 0; }
    if (battle.fieldEnemy && battle.fieldEnemy.mesh) {
      battle.fieldEnemy.alive = false;
      battle.fieldEnemy.mesh.visible = false;
      battle.fieldEnemy.respawnAt = clock.elapsedTime + 45;
    }
    await bSleep(1100);
  } else if (battle.over === 'lose') {

    await bSleep(1200);
    const sp = REGIONS[area].spawn || { x: REGIONS[area].centerX, z: 0.4, row: 0 };
    teleportTo(sp.x, sp.z, sp.row || 0, [0, -1]);
    for (const m of Object.values(PARTY)) { m.hp = m.maxhp; m.mp = m.maxmp; m.down = false; }
  } else if (battle.over === 'fled') {
    noEncounterUntil = clock.elapsedTime + 2.5;
    await bSleep(250);
  }
  el.style.opacity = '0';
  await bSleep(480);
  el.style.display = 'none';
  BGM.set('field');
  inBattle = false; battle.over = false;
}
// フィールドの敵の徘徊とエンカウント判定（animate から毎フレーム呼ばれる）
function updateFieldEnemies(dt, t) {
  for (const e of activeEnemies) {
    if (!e.alive) {
      if (t > e.respawnAt) { e.alive = true; e.mesh.visible = true; e.mesh.position.set(e.home.x, 0, e.home.z); e.tx = e.home.x; e.tz = e.home.z; }
      else continue;
    }
    const p = e.mesh.position;
    const dx = e.tx - p.x, dz = e.tz - p.z, d = Math.hypot(dx, dz);
    if (d < 0.2) {
      e.wait -= dt;
      if (e.wait <= 0) {
        const R = REGIONS[area];
        e.tx = THREE.MathUtils.clamp(e.home.x + (Math.random() - 0.5) * 7, R.bounds.minX + 0.6, R.bounds.maxX - 0.6);
        e.tz = THREE.MathUtils.clamp(e.home.z + (Math.random() - 0.5) * 3.4, R.bounds.minZ + 0.5, R.bounds.maxZ - 0.5);
        e.wait = 1.2 + Math.random() * 2.6;
      }
      p.y = 0;
    } else {
      const sp = 0.55 * dt;
      p.x += dx / d * sp; p.z += dz / d * sp;
      p.y = Math.abs(Math.sin(t * 7 + e.phase)) * 0.035;
      e.mesh.scale.x = dx < 0 ? 1 : -1; // 原画が左向きのため、進行方向へ向くよう反転
    }
    if (e.shadow) { e.shadow.position.x = p.x; e.shadow.position.z = p.z; }
    if (!inBattle && !transitioning && !dialog.open && t > noEncounterUntil &&
        Math.hypot(player.position.x - p.x, player.position.z - p.z) < 0.8) {
      startBattle(e);
    }
  }
}

function drawSword(cv, st) {
  const L = SWORDS[st][4];
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  const set = (x, y, c) => { if (x >= 0 && x < 8 && y >= 0 && y < 16) { g.fillStyle = c; g.fillRect(x, y, 1, 1); } };
  const top = Math.max(0, 11 - L.len);
  for (let y = top; y < 11; y++) {
    const t = (y - top) / (11 - top);
    let cx = 3 + (L.sh === 'moon' || L.sh === 'katana' ? Math.round(Math.sin(t * Math.PI) * (L.sh === 'moon' ? 1.5 : .8)) : 0);
    if (L.sh === 'spear') { if (y < top + 3) { set(cx, y, L.bl[0]); set(cx + 1, y, L.bl[1]); if (y === top + 2) { set(cx - 1, y, L.bl[1]); set(cx + 2, y, L.bl[1]); } } else { set(cx, y, '#8a5a30'); set(cx + 1, y, '#5a3418'); } continue; }
    if (L.sh === 'twin') { set(1, y + 2, L.bl[0]); set(2, y + 2, L.bl[1]); set(5, y, L.bl[0]); set(6, y, L.bl[1]); continue; }
    if (L.sh === 'moon') { const o = Math.round(Math.sin(t * Math.PI) * 2.2); set(2, y, L.bl[0]); for (let i = 3; i <= 4 + o; i++) set(i, y, i === 4 + o ? L.bl[1] : L.bl[0]); continue; }
    set(cx, y, L.bl[0]); if (L.w > 1) set(cx + 1, y, L.bl[1]); if (L.w > 2) set(cx - 1, y, L.bl[0]);
    if (L.sh === 'breaker' && y % 2 === 0) set(cx + 2, y, L.bl[1]);
    if (L.sh === 'wave' && y % 3 === 0) set(cx + 2, y, L.bl[0]);
    if (L.sh === 'seven' && (y === top + 2 || y === top + 5 || y === top + 8)) { set(cx - 1, y, L.bl[1]); set(cx + 2, y - 1, L.bl[1]); }
    if (L.sh === 'light' || L.sh === 'dawn') { if (y % 2) set(cx, y, '#ffffff'); }
    if (L.rust && (y * 7) % 5 === 0) set(cx + 1, y, '#8a5a3a');
  }
  if (L.sh !== 'twin') {
    for (let x = 0; x < 8; x++) { const wide = L.sh === 'rapier' || L.sh === 'dawn' || L.sh === 'light' ? 8 : L.sh === 'spear' ? 4 : 6; if (Math.abs(x - 3.5) < wide / 2) set(x, 11, L.gd); }
    if (L.sh === 'dawn' || L.sh === 'light') { set(0, 10, L.gd); set(7, 10, L.gd); set(3, 11, '#f8a040'); }
    const gl = L.sh === 'spear' ? 3 : L.sh === 'broad' && L.len > 13 ? 4 : 3;
    for (let y = 12; y < 12 + gl; y++) { set(3, y, L.gp); set(4, y, L.gp); }
    set(3, 12 + gl, L.gd); set(4, 12 + gl, L.gd);
  } else {
    for (const x of [1, 5]) { set(x, 13, L.gd); set(x + 1, 13, L.gd); set(x, 14, L.gp); set(x + 1, 14, L.gp); set(x, 15, L.gp); set(x + 1, 15, L.gp); }
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  waterUniforms.uTime.value = t;
  const R = REGIONS[area];
  const wadeZ = R.wadeZ;
  applyTimeOfDay(dt);

  // 移動（目標速度へなめらかに追随させ、歩幅は実際に進んだ距離で進める）
  const pPrevX = player.position.x, pPrevZ = player.position.z;
  const iv = (dialog.open || inBattle) ? { x: 0, z: 0, mag: 0 } : inputVector();
  const MAX_SPEED = 2.5; // 移動速度[m/s]（2026-11-18 実機感想で 3.1 → 2.5 に）
  const accel = 1 - Math.pow(0.0025, dt); // 立ち上がり・停止をなめらかに
  vel.x += (iv.x * MAX_SPEED - vel.x) * accel;
  vel.y += (iv.z * MAX_SPEED - vel.y) * accel;
  const spd = Math.hypot(vel.x, vel.y);
  if (spd > 0.02) {
    const px = player.position.x, pz = player.position.z;
    player.position.x = THREE.MathUtils.clamp(px + vel.x * dt, walkBounds.minX, walkBounds.maxX);
    player.position.z = THREE.MathUtils.clamp(pz + vel.y * dt, walkBounds.minZ, walkBounds.maxZ);
    resolveCollisions(player.position, 0.3);
    const moved = Math.hypot(player.position.x - px, player.position.z - pz);
    if (spd > 0.35) {
      const want = rowFromVel(vel.x, vel.y);
      if (want !== dirRow) {
        if (want === pendRow) { pendT += dt; if (pendT > 0.15) { dirRow = want; pendT = 0; } }
        else { pendRow = want; pendT = 0; }
      } else pendT = 0;
    }
    walkPhase += moved / STEP_LENS[dirRow];
    if (spd > 0.25) {
      const col = WALK_SEQ[Math.floor(walkPhase) % 4];
      setFrameC(player, dirRow, col);
      player.position.y = Math.abs(Math.sin(walkPhase * Math.PI)) * BOB_AMPS[dirRow]; // 歩行の上下動
    } else {
      setFrameC(player, dirRow, 1);
      player.position.y = 0;
    }
    // 浅瀬の波紋
    if (wadeZ !== null && player.position.z < wadeZ && spd > 0.4) {
      rippleTimer += dt;
      if (rippleTimer > 0.26) { rippleTimer = 0; spawnRipple(player.position.x, player.position.z + 0.05); }
    }
  } else {
    setFrameC(player, dirRow, 1);
    player.position.y = 0;
  }

  // 提灯の光をパーティに追随させる
  partyLight.position.set(player.position.x, 1.6, player.position.z + 0.3);
  partyGlow.position.set(player.position.x, 0.9, player.position.z + 0.2);

  // 仲間の追従：プレイヤーの軌跡を記録し、ユイは0.55m後・レイは1.1m後をたどる（2026-11-18 間隔を半分に）
  trailAcc += Math.hypot(player.position.x - pPrevX, player.position.z - pPrevZ);
  if (trailAcc > 0.06) {
    trailAcc = 0;
    trail.unshift({ x: player.position.x, z: player.position.z });
    let total = 0;
    for (let i = 0; i < trail.length - 1; i++) total += Math.hypot(trail[i].x - trail[i + 1].x, trail[i].z - trail[i + 1].z);
    while (total > 3.4 && trail.length > 2) trail.pop();
  }
  updateCompanion(yui, trailPoint(0.55), 0.55, dt, wadeZ);
  resolveCollisions(yui.position, 0.3);
  updateCompanion(rei, trailPoint(1.1), 1.1, dt, wadeZ);
  resolveCollisions(rei.position, 0.3);

  if ((tuftTick++ & 15) === 0) updateTuftVisibility();

  // エリア遷移（地方データの exits に従う）
  if (!transitioning) {
    for (const ex of R.exits || []) {
      let hit = false;
      if (ex.edge === 'east') hit = player.position.x > ex.at;
      else if (ex.edge === 'west') hit = player.position.x < ex.at;
      else if (ex.edge === 'north') hit = player.position.z < ex.at;
      else if (ex.edge === 'south') hit = player.position.z > ex.at;
      if (hit) { startTransition(ex); break; }
    }
  }

  // 大迷宮の入口（黄昏の地の石門に近づくと入る）と迷宮内の判定
  if (area === 'tasogare' && !transitioning && !dialog.open) {
    if (Math.hypot(player.position.x - 778, player.position.z + 2.2) < 1.0) enterLabyrinth();
  }
  labTick(t);
  updateFieldEnemies(dt, t);

  // NPC：近づく／会話中はプレイヤーの方を向く。それ以外は正面で待機アニメ
  const near = nearestNPC();
  talkBtn.style.display = (!dialog.open && near) ? 'block' : 'none';
  for (const npc of activeNPCs) {
    const isTarget = dialog.open ? dialog.npc === npc : near === npc;
    if (isTarget) {
      const kdz = player.position.z - npc.mesh.position.z;
      const kdx = player.position.x - npc.mesh.position.x;
      let krow = 0;
      if (kdz < -0.45) krow = 2;
      else if (Math.abs(kdx) > 0.45) krow = 1;
      setFrameC(npc.mesh, krow, 1);

  }

  // カメラ追従（地方の中心を基準に緩やかにパンする）
  const ccx = R.centerX;

  const wantPos = new THREE.Vector3(camTarget.x, 6.7 + camTarget.z * 0.18, camTarget.z + 8.4); // 2026-11-19 カメラの俯瞰角を約10°上げた（高さ4.6→6.7、注視点は不変）
  camPos.lerp(wantPos, 1 - Math.pow(0.002, dt));
  camera.position.copy(camPos);
  camera.lookAt(camTarget.x, 2.0, camTarget.z - 1.6);

  // 背景ボードと夕日の位置（カメラに追随。湖畔エリアのみ）
  if (area === 'hajimari' && lakeRefs.mountains) {
    lakeRefs.mountains.position.x = camTarget.x + 23;
    lakeRefs.sunGroup.position.x = camTarget.x - 11;
    waterUniforms.uSunPos.value.copy(lakeRefs.sunGroup.position);
  }

  // ビルボードをカメラへ向ける（円筒）
  scene.traverse((o) => { if (o.userData.billboard) o.rotation.y = Math.atan2(camera.position.x - o.position.x, camera.position.z - o.position.z); });

  // ホタル
  for (const s of fireflies) {
    const sd = s.userData.seed, h = s.userData.home;
    s.position.set(
      h.x + Math.sin(t * 0.31 + sd) * 1.3 + Math.sin(t * 0.83 + sd * 2.0) * 0.35,
      h.y + Math.sin(t * 0.57 + sd * 1.7) * 0.3,
      h.z + Math.cos(t * 0.26 + sd) * 0.9
    );
    s.material.opacity = (0.24 + 0.2 * (0.5 + 0.5 * Math.sin(t * 1.4 + sd * 3.1))) * fireflyGain;
  }

  composer.render();
}
applyResponsiveCamera();
try {
  animate();
} catch (err) {
  window.__showErr('ANIMATE: ' + (err.stack || err.message || err));
}
</script>
</body>
</html>
